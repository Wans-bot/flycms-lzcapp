usage: |
  FlyCms 是可私有化部署的内容管理系统，分「门户前台」和「管理后台」两部分：

  - 打开应用首先看到的是门户前台（PC 主题），栏目、文章、商品都在后台维护。
  - 管理后台在应用地址后加 /admin，用首次初始化时写入的管理员账号登录。

  首次使用：

  1. 应用首次启动会自动建库并导入基础数据，需要 2～3 分钟，期间打开会看到等待页。
  2. 后台登录页会自动填入管理员账号 flycms / admin123，图形验证码需要手动输入；登录后请立即在「个人中心」改掉密码。
  3. 后台编辑栏目与文章时，门户前台会同步更新。

  数据持久化：

  - 数据库、上传的图片与附件都放在设备本地存储，重启与升级不会丢失。

application:
  subdomain: flycms
  routes:
    - /=http://web.cloud.lazycat.app.flycms.lzcapp:80
  health_check:
    test_url: http://web.cloud.lazycat.app.flycms.lzcapp:80/api/health
    start_period: 300s
    timeout: 10s
    disable: false

  injects:
    # 审核历史上多次因「没有密码注入 / 没有 OIDC」驳回（alfio #19806、qwenpaw #17901、junyaoktv #20015）。
    # FlyCms 的账号在自己的 fly_admin 表里，没有可对接的 OIDC 入口，因此走官方认可的密码注入：
    # 打开后台登录页时由 inject 把管理员账号密码填进表单，用户不必手打。
    # 这里写的是字面量而非部署参数：数据库里的 bcrypt 是上游示例数据自带的固定值，
    # 若改用安装时随机的部署参数，两边会不一致（改密要用 bcrypt 工具，init 容器里没有）。
    # 图形验证码是 FlyCms 登录的前置校验，注入只负责账号密码，验证码仍需手动输入。
    - id: flycms-admin-autofill
      'on': browser
      auth_required: false
      when:
        - /admin/
        - /admin/*
      do:
        - src: builtin://simple-inject-password
          params:
            user: flycms
            password: admin123
            # 不能自动提交：FlyCms 的登录带图形验证码前置校验，自动提交必然带着空验证码被拦，
            # 页面会停在红框 + 「请先完成验证」的错误态——用户一打开后台看到的就是报错页。
            # 关掉后注入只负责填好账号密码，用户手输验证码再点登录。
            autoSubmit: false
            # 用户已经手填过就不要覆盖
            onlyFillEmpty: true

services:
  flycms-db:
    image: registry.lazycat.cloud/wans/library/mysql:720d8e3ace6b770d
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --default-time-zone=+08:00
      --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
      --max_connections=200
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: '{{ printf "%.24s" (stable_secret "FLYCMS_DB_PASSWORD") }}'
    binds:
      - /lzcapp/var/flycms-mysql:/var/lib/mysql
    healthcheck:
      # mysqladmin ping 在鉴权失败时也返回 0（服务端已应答即为活着），所以不必传口令
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot --silent || exit 1
      start_period: 120s
      interval: 10s
      timeout: 5s
      retries: 30

  flycms-init:
    image: registry.lazycat.cloud/wans/library/mysql:720d8e3ace6b770d
    depends_on:
      - flycms-db
    entrypoint: /bin/bash
    command: /lzcapp/pkg/content/init-db.sh
    environment:
      TZ: Asia/Shanghai
      MYSQL_PWD: '{{ printf "%.24s" (stable_secret "FLYCMS_DB_PASSWORD") }}'
      LZC_DB_HOST: flycms-db
      LZC_DB_USER: root
      LZC_DB_NAME: flycms
      LZC_SQL_FILE: /lzcapp/pkg/content/sql/flycms.sql
    healthcheck:
      test:
        - CMD-SHELL
        - test -f /tmp/init-db.done || exit 1
      start_period: 90s
      interval: 10s
      timeout: 5s
      retries: 90

  flycms:
    image: registry.lazycat.cloud/wans/wans-bot/flycms-lzcapp:071a05e14694a248
    depends_on:
      - flycms-db
      - flycms-init
    environment:
      TZ: Asia/Shanghai
      # 上游 application.yml 用 ${FLYCMS_DB_USER} / ${FLYCMS_DB_PASSWORD} 占位，这里直接喂它的原生变量名
      FLYCMS_DB_USER: root
      FLYCMS_DB_PASSWORD: '{{ printf "%.24s" (stable_secret "FLYCMS_DB_PASSWORD") }}'
      SPRING_DATASOURCE_URL: >-
        jdbc:mysql://flycms-db:3306/flycms?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull&allowMultiQueries=true
      # 上游默认 2MB，后台上传封面图/附件会直接超限
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 64MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 64MB
    binds:
      - /lzcapp/var/flycms-upload:/app/uploadfiles
      - /lzcapp/var/flycms-logs:/app/logs
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:80/api/health >/dev/null || exit 1
      start_period: 180s
      interval: 10s
      timeout: 8s
      retries: 30

  # 统一入口：/admin/ 出后台 SPA，其余反代到 flycms（门户前台与 /api）
  web:
    image: registry.lazycat.cloud/wans/wans-bot/flycms-lzcapp-web:cff666a019674445
    depends_on:
      - flycms
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:80/admin/ || exit 1
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 20
