# FlyCms 统一入口：/admin/ 出后台 SPA，其余全部反代到后端（门户前台 + /api）
server {
    listen 80;
    server_name _;

    # 后台上传封面图/附件，放宽到 200MB
    client_max_body_size 200m;

    # gzip：SPA 的 js 包很大，压缩收益明显
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 管理后台（Vben SPA，hash 路由）：不存在的路径一律回 index.html
    location /admin/ {
        root /usr/share/nginx;
        try_files $uri $uri/ /admin/index.html;
        # index.html 不缓存，否则升级后旧壳子还在加载已删除的 chunk
        location = /admin/index.html {
            add_header Cache-Control "no-cache";
        }
    }

    # 补一个尾斜杠，否则 /admin 会因为目录无索引而 403
    location = /admin {
        return 301 /admin/;
    }

    # 后台 SPA 的静态资源带内容哈希，可以长缓存
    location /admin/assets/ {
        root /usr/share/nginx;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 其余请求（门户前台页面、/api/**、/ucenter/**、/skin/** 等）全部交给后端
    location / {
        # 必须用 lzcos 的服务全名 `<服务>.cloud.lazycat.app.<包名>.lzcapp`：
        # 短名 `flycms` 在盒子内不解析，nginx 启动即 emerg
        #   nginx: [emerg] host not found in upstream "flycms"（2026-10-22 实机验收）
        proxy_pass http://flycms.cloud.lazycat.app.flycms.lzcapp:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 后端 CorsConfig 的白名单默认只有 localhost,127.0.0.1，而盒子域名每个用户不同、构建期不可知。
        # 反代之后后端看到的是 http + 盒子域名，浏览器给的 Origin 是 https + 盒子域名，
        # Spring 的 CorsUtils.isCorsRequest 会据此判成跨域并 403。这里是唯一入口（单源部署），
        # 直接摘掉 Origin 让后端按同源处理；跨站防护由 CSRF 双提交（XSRF-TOKEN / X-XSRF-TOKEN）承担。
        proxy_set_header Origin "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
