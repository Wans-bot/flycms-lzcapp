# FlyCms 打包配置
# 镜像在本机/CI 里现打并内嵌进 LPK（embed），不再依赖 ghcr -> registry.lazycat.cloud
# 的 copy-image 手工步骤，这样 GitHub Actions 才能把「打包->发版->提审」全自动跑完。
manifest: ./lzc-manifest.yml
contentdir: ./content
pkgout: ./dist
icon: ./icon.png

images:
  flycms:
    dockerfile: ./Dockerfile
    context: .
    builder: local
  web:
    dockerfile: ./Dockerfile.web
    context: .
    builder: local
