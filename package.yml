package: cloud.lazycat.app.flycms
version: 2026.9.28-2
name: FlyCms
description: 私有化内容管理系统：栏目、文章、下载、图集、站内搜索与会员体系开箱可用，附一套可直接使用的 PC 门户主题。
author: sunkaifei
license: MIT
homepage: https://github.com/sunkaifei/FlyCms
min_os_version: 1.6.0
# 只随包提供 PC 门户主题：上游的移动/H5 主题是另一套需要额外渲染服务的工程，
# 本包没有包含，手机浏览器访问看到的是同一套 PC 页面。如实声明不支持移动端，
# 而不是靠截图遮盖（技能库 G4 的硬要求：support_mobile=false 时移动截图必须为 0）。
support_mobile: false
permissions:
  required:
    - net.internet
locales:
  zh-CN:
    name: FlyCms 内容管理系统
    description: 私有化的内容管理系统：栏目与文章管理、下载与图集、站内搜索、会员体系，配一套可直接使用的 PC 门户主题，适合搭个人站点或企业内部信息门户。
    usage: |
      FlyCms 分「门户前台」和「管理后台」两部分：打开应用看到的是门户前台，内容都在后台维护。

      首次使用：

      1. 应用首次启动会自动建库并导入上游基础数据，通常一分钟内完成（设备较慢时可能更久）；期间请等它自己跳转。
      2. 管理后台在应用地址后加 /admin。登录页会自动填入管理员账号 flycms / admin123，图形验证码需要手动输入。
      3. 登录后请立刻在「个人中心」修改密码——默认密码是公开的，不改等于门没锁。

      日常使用：

      - 栏目：后台建频道树，控制门户前台的一级/二级导航。
      - 文章：富文本编辑，支持置顶与推荐位，发布后前台即时可见。
      - 会员：前台注册的账号在后台统一管理，可分组与禁用。
      - 附件：上传的图片与文件走本机存储，不依赖第三方图床。

      数据持久化：

      数据库、上传文件与运行日志都放在设备本地存储，重启与升级都不会丢。注意：卸载应用不会删除这些数据，重新安装后会继续使用原有内容；如需彻底清除，请在设备上手动删除该应用的数据目录。

      说明与限制：

      - 本包是上游官方发行版的容器化移植，界面为上游自带的中文界面，未做汉化或改版。
      - 移动端暂不支持，请使用桌面端访问。上游的 H5 主题是另一套需要额外渲染服务的工程，本包未包含。
  en-US:
    name: FlyCms Content Management System
    description: Self-hosted CMS with channels, articles, downloads, galleries, site search and membership, plus a ready-to-use PC portal theme.
    usage: |
      FlyCms has two parts: the public portal (what you see when the app opens) and the admin console.

      First run:

      1. The first start creates the database and imports the bundled seed data; this usually finishes within a minute.
      2. The admin console is at /admin on the app address, with the vendor's default account flycms / admin123.
      3. Change that password in your profile right after the first login - the default is public knowledge.

      Notes and limits:

      - This is a containerised port of the vendor's official release; the UI is the vendor's own Chinese interface.
      - Mobile is not supported; please use a desktop browser. The vendor's H5 theme is a separate project that needs an extra rendering service and is not bundled.
