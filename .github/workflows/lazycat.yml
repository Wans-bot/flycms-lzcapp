name: LazyCat LPK

# FlyCms 自动更新：定时/手动触发 → 用当前源码现打两个镜像并内嵌 → 打包 LPK → 发 Release → 提审。
# 版本号由 upstream-watch 工作流按上游提交变化递增后通过 version 输入传入。
on:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: "auto / check / build / publish-official"
        type: choice
        options: [auto, check, build, publish-official]
        default: auto
      dry-run:
        description: "只演练，不写文件、不发布"
        type: boolean
        default: false
      version:
        description: "显式版本号（留空用 package.yml.version）"
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  lazycat:
    uses: ca-x/lazycat-github-action/.github/workflows/lazycat.yml@3dabca95f6eb0c3a6c4fc889631b13a055852912
    with:
      operation: ${{ inputs.operation || 'auto' }}
      config: .github/lazycat-action.yml
      dry-run: ${{ inputs.dry-run || false }}
      version: ${{ inputs.version || '' }}
      toolchains: docker
      versioned-release-asset: true
    secrets:
      LAZYCAT_TOKEN: ${{ secrets.LAZYCAT_TOKEN }}
